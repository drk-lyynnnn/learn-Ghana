<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VILE AI : BECE and WASSCE help</title>
<style>
 :root { --bg:#000; --ink:#f2f0f7; --green:#7c3aed; --gold:#b6f23c; --line:#2e2a3d; --card:#14111f; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; }
  header { background: var(--green); color: #fff; padding: 14px 16px; border-bottom: 4px solid var(--gold); }
  header h1 { margin: 0; font-size: 1.15rem; }
  header p { margin: 2px 0 0; font-size: .85rem; opacity: .9; }
  #log { flex: 1; overflow-y: auto; padding: 16px; max-width: 720px; width: 100%; margin: 0 auto; }
  .msg { max-width: 85%; padding: 10px 14px; margin: 0 0 10px; border-radius: 10px; white-space: pre-wrap; border: 1px solid var(--line); background: var(--card); }
  .me { margin-left: auto; background: #2a1458; border-color: #5b3aa8; }
  .err { color: #ff8a8a; border-color: #7a2d2d; }
.hint { color: #b9b4c9; }
  .hint { color: #555; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chips button { font: inherit; font-size: .9rem; padding: 6px 12px; border: 1px solid var(--green); background: transparent; color: var(--green); border-radius: 999px; cursor: pointer; }
  form { display: flex; gap: 8px; padding: 12px 16px; max-width: 720px; width: 100%; margin: 0 auto; }
textarea { flex: 1; font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: 8px; resize: none; background: #14111f; color: #f2f0f7; }
  #send { font: inherit; font-weight: 600; padding: 0 18px; border: 0; border-radius: 8px; background: var(--gold); color: #1b1f1d; cursor: pointer; }
  #send:disabled { opacity: .5; cursor: wait; }
  :focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <h1>VILE AI</h1>
  <p>Core Mathematics help for BECE and WASSCE</p>
</header>
<main id="log" aria-live="polite">
  <div class="msg hint">Ask a maths question, or paste a past question and I will guide you through it step by step.
    <div class="chips" id="chips"></div>
  </div>
</main>
<form id="f">
  <textarea id="q" rows="2" placeholder="Type your question" aria-label="Your question"></textarea>
  <button id="send" type="submit">Send</button>
</form>
<script>
  const log = document.getElementById("log"), q = document.getElementById("q"),
        send = document.getElementById("send"), f = document.getElementById("f");
  const history = [];
  ["Explain how to find a percentage of a number", "Solve 3x + 5 = 20", "How do I use Pythagoras theorem?"]
    .forEach((t) => { const b = document.createElement("button"); b.type = "button"; b.textContent = t;
      b.onclick = () => { q.value = t; f.requestSubmit(); }; document.getElementById("chips").append(b); });

  function add(text, cls) { const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text;
    log.append(d); log.scrollTop = log.scrollHeight; return d; }

  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = q.value.trim(); if (!text) return;
    q.value = ""; add(text, "me"); history.push({ role: "user", text });
    send.disabled = true; const wait = add("Thinking...", "hint");
    try {
      const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }) });
      const data = await r.json();
      wait.remove();
      if (!r.ok) { history.pop(); add(data.error || "Something went wrong.", "err"); }
      else { history.push({ role: "model", text: data.reply }); add(data.reply, ""); }
    } catch { wait.remove(); history.pop(); add("No connection. Check your internet and try again.", "err"); }
    send.disabled = false; q.focus();
  });
  q.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); f.requestSubmit(); } });
</script>
</body>
</html>
