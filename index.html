<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vile AI: BECE and WASSCE help</title>
<style>
  :root { --bg:#000; --ink:#f2f0f7; --purple:#7c3aed; --lime:#b6f23c; --line:#2e2a3d; --card:#14111f; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; }
  #log { flex: 1; overflow-y: auto; padding: 16px; max-width: 720px; width: 100%; margin: 0 auto; }
  .msg { max-width: 85%; padding: 10px 14px; margin: 0 0 10px; border-radius: 10px; white-space: pre-wrap; border: 1px solid var(--line); background: var(--card); }
  .me { margin-left: auto; background: #2a1458; border-color: #5b3aa8; }
  .err { color: #ff8a8a; border-color: #7a2d2d; }
  .hint { color: #b9b4c9; }
  #welcome { min-height: 85%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px 0; }
  #welcome svg { width: 150px; height: 150px; filter: drop-shadow(0 0 18px rgba(182,242,60,.25)); }
  #welcome h1 { margin: 14px 0 0; font-size: 2.2rem; font-weight: 900; letter-spacing: .28em; padding-left: .28em; }
  #welcome h2 { margin: 14px 0 4px; font-size: 1.3rem; font-weight: 500; color: #d8d3e6; }
  #welcome p { margin: 0; color: #b9b4c9; font-size: .95rem; }
  form { display: flex; gap: 8px; padding: 12px 16px; max-width: 720px; width: 100%; margin: 0 auto; }
  textarea { flex: 1; font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: 8px; resize: none; background: #14111f; color: #f2f0f7; }
  #send { font: inherit; font-weight: 600; padding: 0 18px; border: 0; border-radius: 8px; background: var(--lime); color: #1b1f1d; cursor: pointer; }
  #send:disabled { opacity: .5; cursor: wait; }
  .vspin { display: inline-block; width: 30px; height: 30px; animation: vturn 1.1s linear infinite; }
  .vspin svg { width: 100%; height: 100%; display: block; }
  @keyframes vturn { to { transform: rotate(360deg); } }
  :focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; }
</style>
</head>
<body>
<main id="log" aria-live="polite">
  <div id="welcome">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="55" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity=".7"/>
      <path d="M33 40 L60 94 L87 40" fill="none" stroke="#7c3aed" stroke-width="9" stroke-linejoin="miter" opacity=".55"/>
      <path d="M33 34 L60 88 L87 34" fill="none" stroke="#b6f23c" stroke-width="9" stroke-linejoin="miter"/>
    </svg>
    <h1>VILE AI</h1>
    <h2>Hi, how can I help you?</h2>
    <p>Ask a maths question or paste a past question.</p>
  </div>
</main>
<form id="f">
  <textarea id="q" rows="2" placeholder="Type your question" aria-label="Your question"></textarea>
  <button id="send" type="submit">Send</button>
</form>
<script>
  const log = document.getElementById("log"), q = document.getElementById("q"),
        send = document.getElementById("send"), f = document.getElementById("f");
  const history = [];
  const SPIN = '<span class="vspin"><svg viewBox="0 0 120 120"><path d="M33 40 L60 94 L87 40" fill="none" stroke="#7c3aed" stroke-width="12" opacity=".55"/><path d="M33 34 L60 88 L87 34" fill="none" stroke="#b6f23c" stroke-width="12"/></svg></span>';

  function add(text, cls) { const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text;
    log.append(d); log.scrollTop = log.scrollHeight; return d; }

  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = q.value.trim(); if (!text) return;
    const w = document.getElementById("welcome"); if (w) w.remove();
    q.value = ""; add(text, "me"); history.push({ role: "user", text });
    send.disabled = true; const wait = add("", "hint"); wait.innerHTML = SPIN;
    try {
      const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }) });
      const data = await r.json();
      wait.remove();
      if (!r.ok) { history.pop(); add(data.error || "Something went wrong.", "err"); }
      else { history.push({ role: "model", text: data.reply }); add(data.reply, ""); }
    } catch { wait.remove(); history.pop(); add("No connection. Check your internet and try again.", "err"); }
    send.disabled = false; q.focus();
  });
  q.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); f.requestSubmit(); } });
</script>
</body>
</html>
